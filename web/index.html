<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职场嘴替（工作版）</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1a1d23; --muted:#6b7280; --line:#e5e7eb;
    --primary:#111827; --accent:#2563eb; --accent-bg:#eff6ff;
    --high:#dc2626; --high-bg:#fef2f2; --medium:#d97706; --medium-bg:#fffbeb;
    --ok:#059669; --ok-bg:#ecfdf5; --danger-bg:#fff1f2; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 64px}
  header{padding:28px 0 8px;text-align:center}
  header h1{margin:0;font-size:32px;letter-spacing:-.02em}
  .tagline{color:var(--muted);margin:8px 0 4px;font-size:16px}
  .status{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);display:inline-block;padding:6px 12px;border-radius:999px;margin-top:12px}
  .status b{color:var(--text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  label{font-weight:600;font-size:14px;display:block;margin:14px 0 6px}
  label:first-child{margin-top:0}
  textarea,select,input[type=number],input[type=file]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--text)}
  textarea{min-height:110px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr 120px;gap:12px}
  @media(max-width:640px){.row{grid-template-columns:1fr 1fr}.row .hour{grid-column:span 2} header h1{font-size:26px}}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  button{cursor:pointer;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--text)}
  button.primary{background:var(--primary);color:#fff;border-color:var(--primary);flex:1;min-width:180px}
  button.primary:disabled{opacity:.55;cursor:not-allowed}
  button.small{padding:6px 14px;font-size:13px}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .divider{border:none;border-top:1px dashed var(--line);margin:20px 0 4px}
  .alert{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .alert.error{display:block;background:var(--high-bg);border:1px solid #fecaca;color:#7f1d1d}
  .alert.info{display:block;background:var(--accent-bg);border:1px solid #bfdbfe;color:#1e3a5f}
  #results{display:none}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;vertical-align:middle}
  .badge.llm{background:#ede9fe;color:#5b21b6}
  .badge.rules{background:var(--accent-bg);color:#1d4ed8}
  .badge.scene{background:#f3f4f6;color:#374151}
  .card h2{margin:0 0 10px;font-size:17px}
  .card h3{margin:0 0 8px;font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .evidence{color:var(--muted);font-size:13px;margin-top:6px}
  ul.risks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  ul.risks li{padding:10px 12px;border-radius:10px;font-size:14px}
  ul.risks li.high{background:var(--high-bg);border-left:4px solid var(--high)}
  ul.risks li.medium{background:var(--medium-bg);border-left:4px solid var(--medium)}
  ul.risks li.low{background:var(--ok-bg);border-left:4px solid var(--ok)}
  .level{font-weight:700;margin-right:6px}
  .level.high{color:var(--high)} .level.medium{color:var(--medium)} .level.low{color:var(--ok)}
  .reply{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .reply-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .reply-text{margin:8px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .risk-note{font-size:13px;color:var(--muted)}
  .anti{background:var(--danger-bg)}
  .transcript{white-space:pre-wrap;word-break:break-word;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
  .commit-grid{display:grid;gap:6px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>职场嘴替（工作版）</h1>
    <p class="tagline">先翻译潜台词，再给能发的回复</p>
    <div><span class="status" id="healthStatus">大模型：检查中…</span></div>
  </header>

  <main>
    <form id="analyzeForm" class="card">
      <label for="text">对方发来的消息</label>
      <textarea id="text" name="text" placeholder="把对方发来的消息粘进来，例如：顺便把上周的用户数据整理成表，周五下班前给我"></textarea>

      <div class="row">
        <div>
          <label for="relation">对方是谁</label>
          <select id="relation" name="relation">
            <option value="直属领导" selected>直属领导</option>
            <option value="大领导">大领导</option>
            <option value="客户">客户</option>
            <option value="HR">HR</option>
            <option value="同事">同事</option>
          </select>
        </div>
        <div>
          <label for="intent">你想怎么回</label>
          <select id="intent" name="intent">
            <option value="争取时间">争取时间</option>
            <option value="委婉拒绝">委婉拒绝</option>
            <option value="认错说明">认错说明</option>
            <option value="汇报进度">汇报进度</option>
            <option value="确认任务" selected>确认任务</option>
            <option value="请示确认">请示确认</option>
          </select>
        </div>
        <div class="hour">
          <label for="hour">当前小时</label>
          <input type="number" id="hour" name="hour" min="0" max="23" step="1">
        </div>
      </div>

      <hr class="divider">
      <label for="image">截图识别（可选）</label>
      <input type="file" id="image" accept="image/*">
      <p class="hint">截图识别需要配置大模型；未配置时会明确提示，不会假装识别成功。选择截图后点击下方按钮将优先走截图分析。</p>

      <div class="actions">
        <button type="button" id="sampleBtn">试试示例</button>
        <button type="submit" id="submitBtn" class="primary">分析这句怎么回</button>
      </div>
      <div id="alertBox" class="alert" role="alert"></div>
    </form>

    <section id="results" aria-live="polite"></section>
  </main>

  <footer>职场嘴替（工作版） · 先看懂风险，再决定怎么回</footer>
</div>

<script>
(function(){
  "use strict";
  function escapeHtml(str){
    return String(str == null ? "" : str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  var form = document.getElementById("analyzeForm");
  var textEl = document.getElementById("text");
  var relationEl = document.getElementById("relation");
  var intentEl = document.getElementById("intent");
  var hourEl = document.getElementById("hour");
  var imageEl = document.getElementById("image");
  var submitBtn = document.getElementById("submitBtn");
  var alertBox = document.getElementById("alertBox");
  var resultsEl = document.getElementById("results");
  var healthEl = document.getElementById("healthStatus");

  hourEl.value = new Date().getHours();

  function showAlert(msg, kind){
    alertBox.textContent = msg || "";
    alertBox.className = "alert" + (msg ? " " + (kind || "error") : "");
    alertBox.style.display = msg ? "block" : "none";
  }
  function clearAlert(){ showAlert(""); alertBox.style.display="none"; }

  // 健康检查
  fetch("/api/health").then(function(r){ return r.json(); }).then(function(d){
    if(d && d.llmConfigured){
      healthEl.innerHTML = "大模型：<b>已配置</b>（" + escapeHtml(d.model || "") + "）";
    } else {
      healthEl.innerHTML = "大模型：<b>未配置（当前用规则引擎）</b>";
    }
  }).catch(function(){
    healthEl.textContent = "大模型：状态未知（当前用规则引擎）";
  });

  document.getElementById("sampleBtn").addEventListener("click", function(){
    textEl.value = "顺便把上周的用户数据整理成表，周五下班前给我";
    relationEl.value = "直属领导";
    intentEl.value = "确认任务";
    if(imageEl) imageEl.value = "";
    textEl.focus();
  });

  function copyText(text, btn){
    function done(){
      var old = btn.textContent; btn.textContent = "已复制";
      setTimeout(function(){ btn.textContent = old; }, 1500);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
  }

  function renderResult(r){
    var isLLM = r.source === "llm";
    var sourceBadge = isLLM
      ? '<span class="badge llm">大模型</span>'
      : '<span class="badge rules">规则引擎</span>';
    var html = "";

    html += '<div class="card"><h2>分析结果 ' + sourceBadge + ' '
      + '<span class="badge scene">' + escapeHtml(r.scenarioName || r.scenario || "") + '</span></h2>'
      + '<p class="muted" style="margin:0">场景：' + escapeHtml(r.scenarioName || "") + '（' + escapeHtml(r.scenario || "") + '） · 关系：' + escapeHtml(r.relation || "") + ' · 意图：' + escapeHtml(r.intent || "") + '</p></div>';

    if(r.transcript){
      html += '<div class="card"><h2>📷 截图转录</h2><div class="transcript">' + escapeHtml(r.transcript) + '</div></div>';
    }

    if(r.subtext){
      html += '<div class="card"><h2>🧭 潜台词</h2><p style="margin:0">' + escapeHtml(r.subtext.line || "") + '</p>'
        + (r.subtext.evidence ? '<p class="evidence">' + escapeHtml(r.subtext.evidence) + '</p>' : '') + '</div>';
    }

    html += '<div class="card"><h2>⚠️ 风险提示</h2>';
    if(r.risks && r.risks.length){
      html += '<ul class="risks">';
      r.risks.forEach(function(x){
        var lvl = (x.level === "high" || x.level === "medium" || x.level === "low") ? x.level : "medium";
        var lvlText = lvl === "high" ? "高" : (lvl === "low" ? "低" : "中");
        html += '<li class="' + lvl + '"><span class="level ' + lvl + '">' + lvlText + '</span>' + escapeHtml(x.detail || x.type || "") + '</li>';
      });
      html += '</ul>';
    } else {
      html += '<p class="muted" style="margin:0">暂无明显风险提示</p>';
    }
    html += '</div>';

    if(r.commitment){
      html += '<div class="card"><h2>📌 承诺抽取</h2><div class="commit-grid">'
        + '<div>任务：' + escapeHtml(r.commitment.task || "（本次无新任务）") + '</div>'
        + '<div>截止：' + escapeHtml(r.commitment.deadlineText || "未给出") + '</div>'
        + '<div>需要反问确认：' + (r.commitment.needsConfirm ? "是 — 回复里必须带确认动作" : "否") + '</div>'
        + '</div></div>';
    }

    html += '<div class="card"><h2>💬 可直接发的回复（3 个版本）</h2><div id="replyList">';
    if(r.replies && r.replies.length){
      r.replies.forEach(function(rep, idx){
        html += '<div class="reply"><div class="reply-head"><strong>' + escapeHtml(rep.label || "") + '</strong>'
          + '<button type="button" class="small copy-btn" data-idx="' + idx + '">复制</button></div>'
          + '<p class="reply-text">' + escapeHtml(rep.text || "") + '</p>'
          + '<p class="risk-note">' + escapeHtml(rep.riskNote || "") + '</p></div>';
      });
    }
    html += '</div></div>';

    if(r.antiExample){
      html += '<div class="card anti"><h2>🚫 反面教材 · 千万别这样回</h2>'
        + '<p style="margin:0">「' + escapeHtml(r.antiExample.text || "") + '」</p>'
        + '<p class="risk-note">原因：' + escapeHtml(r.antiExample.reason || "") + '</p></div>';
    }

    resultsEl.innerHTML = html;
    resultsEl.style.display = "block";

    // bind copy buttons (text stored in closure, not in DOM attributes)
    var btns = resultsEl.querySelectorAll(".copy-btn");
    btns.forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        var rep = r.replies && r.replies[idx];
        if(rep) copyText(rep.text || "", btn);
      });
    });
    resultsEl.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function readFileAsDataURL(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error("读取图片失败")); };
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    clearAlert();
    var hourVal = hourEl.value === "" ? new Date().getHours() : Number(hourEl.value);
    var file = imageEl.files && imageEl.files[0];

    submitBtn.disabled = true;
    var oldText = submitBtn.textContent;
    submitBtn.textContent = "分析中…";

    function finish(){ submitBtn.disabled = false; submitBtn.textContent = oldText; }

    if(file){
      readFileAsDataURL(file).then(function(dataUrl){
        var str = String(dataUrl || "");
        var mime = file.type || "image/png";
        var base64 = str;
        var comma = str.indexOf(",");
        if(comma >= 0) base64 = str.slice(comma + 1);
        // try to get mime from data URL
        var m = str.match(/^data:([^;]+);base64,/);
        if(m) mime = m[1];
        return fetch("/api/image", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({imageBase64: base64, mime: mime, relation: relationEl.value, intent: intentEl.value, hour: hourVal})
        }).then(function(resp){
          return resp.json().catch(function(){ return {}; }).then(function(data){
            if(resp.status === 422){
              showAlert(data.message || data.error || "截图识别失败：大模型未配置或识别失败", "error");
              resultsEl.style.display = "none";
              return;
            }
            if(!resp.ok){
              showAlert(data.message || data.error || ("请求失败（" + resp.status + "）"), "error");
              return;
            }
            renderResult(data);
          });
        });
      }).catch(function(err){
        showAlert(err.message || "截图处理失败", "error");
      }).finally(finish);
      return;
    }

    var text = textEl.value.trim();
    if(!text){
      showAlert("请先粘贴对方发来的消息，或选择一张聊天截图", "error");
      finish();
      return;
    }
    fetch("/api/analyze", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text: text, relation: relationEl.value, intent: intentEl.value, hour: hourVal})
    }).then(function(resp){
      return resp.json().catch(function(){ return {}; }).then(function(data){
        if(!resp.ok){
          showAlert(data.message || data.error || ("请求失败（" + resp.status + "）"), "error");
          return;
        }
        renderResult(data);
      });
    }).catch(function(){
      showAlert("网络错误，请确认本地服务已启动后重试", "error");
    }).finally(finish);
  });
})();
</script>
</body>
</html>
